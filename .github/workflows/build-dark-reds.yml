name: Build Dark Reds Video

on:
  push:
    branches:
      - dark-reds-download
    paths-ignore:
      - 'public/download/dark-reds.mp4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dark-reds-video
  cancel-in-progress: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dark-reds-download

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil python3-numpy fonts-dejavu-core

      - name: Render Manisa away Story edit
        run: |
          python3 dark-reds-assets/render_deplasman.py
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 public/download/dark-reds.mp4

      - name: Commit rendered video
        run: |
          git config user.name "Dark Reds Video Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/download/dark-reds.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Build Manisa away story edit [skip ci]"
            git push origin dark-reds-download
          fi
