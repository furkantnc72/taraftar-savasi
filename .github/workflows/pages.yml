name: Taraftar Savaşı - GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Pages ayarla
        uses: actions/configure-pages@v5
      - name: Site dosyalarını hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Yayına al
        id: deployment
        uses: actions/deploy-pages@v4
