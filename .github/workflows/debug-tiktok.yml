name: TikTok Bağlantı Teşhisi
on:
  push:
    paths:
      - 'debug-tiktok.js'
      - '.github/workflows/debug-tiktok.yml'
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install
      - run: node debug-tiktok.js
